databases:
  - name: douce-boutique-db
    plan: free
    databaseName: douceboutique
    user: douceboutique

services:
  - type: web
    name: douce-boutique
    runtime: static
    branch: production
    rootDir: .
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://douce-boutique-api.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: douce-boutique-api
    runtime: python
    plan: free
    branch: production
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_produits && python manage.py create_admin"
    startCommand: "gunicorn ecommerce.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: douce-boutique-db
          property: connectionString
      # À renseigner manuellement dans le tableau de bord Render (voir guide
      # de déploiement) :
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SMS_SENDER
        value: DouceBoutik
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_NOTIFY_URL
        value: https://douce-boutique-api.onrender.com/api/paiements/cinetpay/notify/
      # Crée (ou promeut) ce compte en admin au déploiement — choisis un vrai
      # email/mot de passe forts, ce ne sont pas des valeurs de démo.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Stockage des images produits (Cloudflare R2, gratuit) — indispensable
      # en production, voir guide de déploiement pour créer le bucket.
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
