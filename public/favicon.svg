<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé bleu -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle bleu -->
  <circle cx="128" cy="128" r="128" fill="url(#blueGradient)"/>
  
  <!-- Cercle blanc intérieur -->
  <circle cx="128" cy="128" r="110" fill="#f0f9ff" opacity="0.95"/>
  
  <!-- Lettre "D" stylisée (pour Douce) -->
  <g transform="translate(128, 128)">
    <!-- D -->
    <path d="M -25 -35 L -15 -35 Q 15 -35 15 0 Q 15 35 -15 35 L -25 35 Z" fill="#1e40af" stroke="none"/>
    
    <!-- Point (fleur) -->
    <circle cx="0" cy="-50" r="6" fill="#ec4899"/>
    <circle cx="-8" cy="-45" r="5" fill="#f43f5e"/>
    <circle cx="8" cy="-45" r="5" fill="#f43f5e"/>
  </g>
</svg>